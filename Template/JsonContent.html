<link rel="stylesheet" href="https://codemirror.local/codemirror.css" />
<link rel="stylesheet" href="https://codemirror.local/addon/fold/foldgutter.css" />
<script type="text/javascript" src="https://codemirror.local/codemirror.js"></script>
<script type="text/javascript" src="https://codemirror.local/addon/fold/foldcode.js"></script>
<script type="text/javascript" src="https://codemirror.local/addon/fold/foldgutter.js"></script>
<script type="text/javascript" src="https://codemirror.local/addon/fold/brace-fold.js"></script>
<script type="text/javascript" src="https://codemirror.local/addon/fold/comment-fold.js"></script>
<script type="text/javascript" src="https://codemirror.local/mode/javascript.js"></script>

<textarea id="txtContent"></textarea>

<style>
    .CodeMirror {
        font-size: 14px;
        border: 1px solid gray;
        height: 100% !important;
    }

    .cm-property {
        color: #2E75B6 !important;
    }

    .cm-s-default .cm-string {
        color: #A31515;
    }
</style>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
        document.body.style.overflowY = 'hidden';
        var option = {
            mode: { name: "javascript", json: true },
            readOnly: true,
            lineNumbers: true,
            lineWrapping: false,
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
            extraKeys: { "Ctrl-Q": function (cm) { cm.foldCode(cm.getCursor()); } },
            theme: "default",
            viewportMargin: Infinity
        };

        var editor = CodeMirror.fromTextArea(document.getElementById("txtContent"), option);

        editor.setValue(decodeURIComponent('##Content##'));
    });

</script>
